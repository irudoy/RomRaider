name: RomRaider build

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

# Runs of one ref wait for each other, so every master release takes the
# number after the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      fork: ${{ steps.version.outputs.fork }}
      publish: ${{ steps.version.outputs.publish }}
      notes: ${{ steps.version.outputs.notes }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: version.properties
          sparse-checkout-cone-mode: false

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          property() {
            awk -F= -v key="$1" '$1 == key { print $2; exit }' version.properties
          }
          base="$(property version.major).$(property version.minor).$(property version.patch)"
          if [[ ! "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version.properties yields an invalid base version: ${base}"
            exit 1
          fi

          publish=false
          fork=0
          notes=""
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/master ]]; then
            publish=true
            # A rerun for a commit that already carries a release tag keeps it.
            released="$(git tag --points-at HEAD --list "${base}-hd.*" | head -n 1)"
            if [[ -n "$released" ]]; then
              fork="${released#"${base}-hd."}"
            else
              highest=0
              for tag in $(git tag --list "${base}-hd.*"); do
                number="${tag#"${base}-hd."}"
                if [[ "$number" =~ ^[0-9]+$ ]] && ((number > highest)); then
                  highest="$number"
                fi
              done
              fork="$((highest + 1))"
            fi
          fi
          version="${base}-hd.${fork}"

          if [[ "$publish" == true ]]; then
            previous="$(git describe --tags --abbrev=0 \
              --match '[0-9]*-hd.[0-9]*' --exclude "$version" HEAD 2>/dev/null || true)"
            if [[ -n "$previous" ]]; then
              notes="$(git log --no-merges --format='- %s' "${previous}..HEAD")

          Changes: https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${version}"
            else
              notes="Differences from upstream: https://github.com/${GITHUB_REPOSITORY}#differences-from-upstream"
            fi
          fi

          echo "Version: ${version}"
          delimiter="notes_${GITHUB_RUN_ID}_${RANDOM}"
          {
            echo "version=${version}"
            echo "fork=${fork}"
            echo "publish=${publish}"
            echo "notes<<${delimiter}"
            printf '%s\n' "$notes"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

  packages:
    name: Windows and Linux packages
    needs: version
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      ROMRAIDER_VERSION_FORK: ${{ needs.version.outputs.fork }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64

      - name: Verify toolchain
        run: |
          java -version
          ant -version

      - name: Run tests and build standalone packages
        run: ant standalone

      - name: Ensure NSIS is available
        shell: pwsh
        run: |
          $onPath = Get-Command makensis.exe -ErrorAction SilentlyContinue
          $installed = Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not $onPath -and -not $installed) {
            choco install nsis --yes --no-progress
          }

      - name: Build Windows installer
        shell: pwsh
        run: .\tools\windows\build-windows-installer.ps1 -SkipBuild

      - name: Store Windows installer
        if: needs.version.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-installer
          path: build/dist/windows/*-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Store Windows release package
        if: needs.version.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: build/dist/windows/*-windows.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Store Linux release package
        if: needs.version.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: build/dist/linux/*-linux.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  macos-app:
    name: macOS Apple Silicon application
    needs: version
    runs-on: macos-15
    timeout-minutes: 30
    env:
      ROMRAIDER_VERSION_FORK: ${{ needs.version.outputs.fork }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          architecture: aarch64

      - name: Build and verify application bundle
        shell: bash
        run: |
          export ROMRAIDER_JAVA_HOME="$JAVA_HOME"
          export ROMRAIDER_ANT="$(command -v ant)"
          tools/macos/install-macos-app.sh \
            --app "$RUNNER_TEMP/RomRaiderHD.app"

      - name: Create macOS application archive
        if: needs.version.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          /usr/bin/ditto \
            -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/RomRaiderHD.app" \
            "$RUNNER_TEMP/RomRaiderHD-${VERSION}-macos-arm64.zip"
          /usr/bin/unzip -t "$RUNNER_TEMP/RomRaiderHD-${VERSION}-macos-arm64.zip"

      - name: Store macOS release package
        if: needs.version.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: ${{ runner.temp }}/RomRaiderHD-${{ needs.version.outputs.version }}-macos-arm64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Build Java 17 builder image
        run: docker build --tag romraider-builder:test .

      - name: Run tests and build packages in container
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/home/romraider/RomRaider" \
            romraider-builder:test ant all

  release:
    name: Publish release
    if: needs.version.outputs.publish == 'true'
    needs:
      - version
      - packages
      - macos-app
      - container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify release packages
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*)
          [[ "${#assets[@]}" -eq 4 ]]
          [[ -f "release-assets/RomRaiderHD-${VERSION}-windows.zip" ]]
          [[ -f "release-assets/RomRaiderHD-${VERSION}-setup.exe" ]]
          [[ -f "release-assets/RomRaiderHD-${VERSION}-linux.zip" ]]
          [[ -f "release-assets/RomRaiderHD-${VERSION}-macos-arm64.zip" ]]

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          NOTES: ${{ needs.version.outputs.notes }}
        run: |
          set -euo pipefail
          release_tag="$VERSION"
          release_title="RomRaiderHD ${VERSION}"
          release_notes="${NOTES}

          Packages:
          - Windows installer with a bundled Java runtime
          - Windows standalone ZIP
          - Linux standalone ZIP
          - macOS Apple Silicon application ZIP

          The Windows installer carries its own Java runtime. The standalone
          ZIP packages and the macOS application require Java 17 or newer."

          if release_is_draft="$(gh release view "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$release_is_draft" == "false" ]]; then
              echo "Release ${release_tag} is already published."
              exit 0
            fi
          else
            gh release create "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$release_title" \
              --notes "$release_notes" \
              --draft \
              --latest
          fi

          gh release upload "$release_tag" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          gh release edit "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$release_title" \
            --notes "$release_notes" \
            --draft=false \
            --latest
