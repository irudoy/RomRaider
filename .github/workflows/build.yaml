name: RomRaider build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      notes: ${{ steps.version.outputs.notes }}

    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            version.properties
            CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          property() {
            awk -F= -v key="$1" '$1 == key { print $2; exit }' version.properties
          }
          version="$(property version.major).$(property version.minor).$(property version.patch)-hd.$(property version.fork)"
          version_pattern='^[0-9]+\.[0-9]+\.[0-9]+-hd\.[0-9]+$'
          if [[ ! "$version" =~ $version_pattern ]]; then
            echo "::error::version.properties yields an invalid version: ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Version: ${version}"

          publish=false
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            if [[ "$GITHUB_REF" == refs/heads/master ]]; then
              publish=true
            elif [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" =~ $version_pattern ]]; then
              if [[ "$GITHUB_REF_NAME" != "$version" ]]; then
                echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${version} from version.properties"
                exit 1
              fi
              notes="$(awk -v version="$version" '
                /^## / { if (found) exit; found = ($2 == version); next }
                found { print }
              ' CHANGELOG.md | sed -e '/./,$!d')"
              if [[ -z "$notes" ]]; then
                echo "::error::CHANGELOG.md has no section for ${version}"
                exit 1
              fi
              delimiter="notes_${GITHUB_RUN_ID}_${RANDOM}"
              {
                echo "notes<<${delimiter}"
                printf '%s\n' "$notes"
                echo "${delimiter}"
              } >> "$GITHUB_OUTPUT"
              publish=true
            fi
          fi
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

  packages:
    name: Windows and Linux packages
    needs: version
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64

      - name: Verify toolchain
        run: |
          java -version
          ant -version

      - name: Run tests and build standalone packages
        run: ant standalone

      - name: Ensure NSIS is available
        shell: pwsh
        run: |
          $onPath = Get-Command makensis.exe -ErrorAction SilentlyContinue
          $installed = Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not $onPath -and -not $installed) {
            choco install nsis --yes --no-progress
          }

      - name: Build Windows installer
        shell: pwsh
        run: .\tools\windows\build-windows-installer.ps1 -SkipBuild

      - name: Store Windows installer
        if: needs.version.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-installer
          path: build/dist/windows/*-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Store Windows release package
        if: needs.version.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: build/dist/windows/*-windows.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Store Linux release package
        if: needs.version.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: build/dist/linux/*-linux.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  macos-app:
    name: macOS Apple Silicon application
    needs: version
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          architecture: aarch64

      - name: Build and verify application bundle
        shell: bash
        run: |
          export ROMRAIDER_JAVA_HOME="$JAVA_HOME"
          export ROMRAIDER_ANT="$(command -v ant)"
          tools/macos/install-macos-app.sh \
            --app "$RUNNER_TEMP/RomRaiderHD.app"

      - name: Create macOS application archive
        if: needs.version.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          /usr/bin/ditto \
            -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/RomRaiderHD.app" \
            "$RUNNER_TEMP/RomRaiderHD-${VERSION}-macos-arm64.zip"
          /usr/bin/unzip -t "$RUNNER_TEMP/RomRaiderHD-${VERSION}-macos-arm64.zip"

      - name: Store macOS release package
        if: needs.version.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: ${{ runner.temp }}/RomRaiderHD-${{ needs.version.outputs.version }}-macos-arm64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Build Java 17 builder image
        run: docker build --tag romraider-builder:test .

      - name: Run tests and build packages in container
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/home/romraider/RomRaider" \
            romraider-builder:test ant all

  release:
    name: Publish release
    if: needs.version.outputs.publish == 'true'
    needs:
      - version
      - packages
      - macos-app
      - container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify release packages
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*)
          [[ "${#assets[@]}" -eq 4 ]]
          [[ -f "release-assets/RomRaiderHD-${VERSION}-windows.zip" ]]
          [[ -f "release-assets/RomRaiderHD-${VERSION}-setup.exe" ]]
          [[ -f "release-assets/RomRaiderHD-${VERSION}-linux.zip" ]]
          [[ -f "release-assets/RomRaiderHD-${VERSION}-macos-arm64.zip" ]]

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          CHANGELOG_NOTES: ${{ needs.version.outputs.notes }}
        run: |
          set -euo pipefail
          packages="Packages:
          - Windows installer with a bundled Java runtime
          - Windows standalone ZIP
          - Linux standalone ZIP
          - macOS Apple Silicon application ZIP

          The Windows installer carries its own Java runtime. The standalone
          ZIP packages and the macOS application require Java 17 or newer."

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            release_tag="$GITHUB_REF_NAME"
            release_title="RomRaiderHD ${VERSION}"
            release_notes="${CHANGELOG_NOTES}

          ${packages}"
            release_kind=(--prerelease=false --latest)
            release_target=(--verify-tag)
          else
            release_tag="master-${GITHUB_SHA}"
            short_sha="${GITHUB_SHA:0:7}"
            release_title="RomRaiderHD master ${short_sha}"
            release_notes="Automated prerelease built from master.

          Version: ${VERSION}
          Commit: ${GITHUB_SHA}

          ${packages}"
            release_kind=(--prerelease --latest=false)
            release_target=(--target "$GITHUB_SHA")
          fi

          if release_is_draft="$(gh release view "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$release_is_draft" == "false" ]]; then
              echo "Release ${release_tag} is already published."
              exit 0
            fi
          else
            gh release create "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              "${release_target[@]}" \
              --title "$release_title" \
              --notes "$release_notes" \
              --draft \
              "${release_kind[@]}"
          fi

          gh release upload "$release_tag" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          gh release edit "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$release_title" \
            --notes "$release_notes" \
            --draft=false \
            "${release_kind[@]}"
