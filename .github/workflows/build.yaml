name: RomRaider build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  packages:
    name: Windows and Linux packages
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64

      - name: Verify toolchain
        run: |
          java -version
          ant -version

      - name: Run tests and build packages
        run: ant all

  macos-app:
    name: macOS Apple Silicon application
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          architecture: aarch64

      - name: Build and verify application bundle
        shell: bash
        run: |
          export ROMRAIDER_JAVA_HOME="$JAVA_HOME"
          export ROMRAIDER_ANT="$(command -v ant)"
          tools/macos/install-macos-app.sh \
            --app "$RUNNER_TEMP/RomRaiderHD.app"

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Build Java 17 builder image
        run: docker build --tag romraider-builder:test .

      - name: Run tests and build packages in container
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/home/romraider/RomRaider" \
            romraider-builder:test ant all
